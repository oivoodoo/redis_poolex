name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    env:
      MIX_ENV: test
      REDIS_URL: redis://127.0.0.1:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.17.3"
            otp: "27.3"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          # OTP 27.1.3–27.2 rejects builds.hex.pm TLS (erlang/otp#9208).
          # Prefer a patched OTP and fall back to the jsDelivr Hex mirror.
          hexpm-mirrors: |
            https://cdn.jsdelivr.net/hex
            https://builds.hex.pm

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors --no-optional-deps

      - name: Check formatting
        if: matrix.elixir == '1.17.3'
        run: mix format --check-formatted

      - name: Test
        run: mix test
